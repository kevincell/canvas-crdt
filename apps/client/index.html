<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRDT Canvas — Collaborative Drawing Board</title>
    <meta name="description" content="Real-time collaborative drawing board using CRDTs and WebRTC" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Polyfill Node.js globals for browser -->
    <script>
      // Must use var (not let/const) so it becomes a global property accessible as bare identifier
      var global = typeof globalThis !== 'undefined' ? globalThis : window;
      var process = {
        env: { NODE_ENV: 'development' },
        cwd: function() { return '/'; },
        nextTick: function(cb) {
          var args = Array.prototype.slice.call(arguments, 1);
          if (typeof queueMicrotask === 'function') {
            queueMicrotask(function() { cb.apply(null, args); });
          } else {
            setTimeout(function() { cb.apply(null, args); }, 0);
          }
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
